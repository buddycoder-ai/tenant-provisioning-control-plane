[project]
name = "tenant-provisioning-control-plane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116", "uvicorn[standard]>=0.30,<0.31",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<3.3", "pika>=1.3,<1.4",
  "pydantic>=2.9,<2.10", "alembic>=1.13,<1.14", "python-json-logger>=2.0,<3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<8.4", "httpx>=0.27,<0.28", "ruff>=0.6,<0.7", "mypy>=1.11,<1.12", "bandit>=1.7,<1.8"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.mypy]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["app*"]
